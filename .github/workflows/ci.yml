name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The app links Stoa and the engine from sibling checkouts
    # (link:../stoa-system/..., link:../tyche-market/pkg), so the three
    # repositories are checked out side by side.
    defaults:
      run:
        working-directory: tyche-replay
    env:
      E2E_PORT: 4181
    steps:
      - uses: actions/checkout@v4
        with:
          path: tyche-replay
      - uses: actions/checkout@v4
        with:
          repository: Valkyra-Labs/stoa-system
          ref: main
          path: stoa-system
      - uses: actions/checkout@v4
        with:
          repository: Valkyra-Labs/tyche-market
          ref: main
          path: tyche-market

      # The engine, built as tyche-market's own CI builds it.
      - name: Engine toolchain
        working-directory: tyche-market
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tyche-market
      - name: wasm-pack
        working-directory: tyche-market
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Engine (wasm-pack)
        working-directory: tyche-market
        run: wasm-pack build --release --target web --out-dir pkg --out-name tyche_market -- --no-default-features --features wasm

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tyche-replay/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            tyche-replay/pnpm-lock.yaml
            stoa-system/pnpm-lock.yaml
      - name: Stoa
        working-directory: stoa-system
        run: pnpm install --frozen-lockfile && pnpm build

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # The captures of a trading day are not in git, and CI does not
      # download them, so it runs only the tests that need none: the unit
      # tests but the heatmap's, and the e2e tests tagged @no-capture.
      - name: Unit tests that need no capture
        shell: bash
        run: pnpm test:no-capture 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: e2e tests that need no capture, against vite preview of the build
        env:
          E2E_PREVIEW: "1"
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e.json
        run: pnpm e2e:no-capture --reporter=list,json
      # Every run builds the badges, so a value that can no longer be read
      # fails here, on the pull request; only main publishes them.
      - name: Badge values
        run: >-
          node scripts/badges.mjs --out "$RUNNER_TEMP/badges"
          --unit "$RUNNER_TEMP/unit.log"
          --e2e "$RUNNER_TEMP/e2e.json"
          --dist dist
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: badges
          path: ${{ runner.temp }}/badges
          if-no-files-found: error
          retention-days: 7

  # Commits the badge JSON to the orphan branch `badges`, which the README's
  # img.shields.io/endpoint badges read. Only after a green run on main.
  publish-badges:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: badges
          path: ${{ runner.temp }}/badges
      - name: Commit to the badges branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$RUNNER_TEMP/badges-branch"
          status=0
          git ls-remote --exit-code origin refs/heads/badges > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin badges
            git worktree add -B badges "$branch" FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            git worktree add --detach "$branch"
            git -C "$branch" switch --orphan badges
          else
            exit "$status"
          fi
          find "$branch" -maxdepth 1 -name '*.json' -delete
          cp "$RUNNER_TEMP"/badges/*.json "$branch"/
          cd "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "The badges are unchanged."
            exit 0
          fi
          git commit -q -m "Badges measured on ${GITHUB_SHA}"
          git push origin HEAD:refs/heads/badges
